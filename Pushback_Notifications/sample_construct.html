            // Establish WebSocket connection

            socket = new WebSocket(urlWithToken);
            
            socket.onopen = function () {
                console.log('WebSocket connection opened');
                messageOutput.innerText += 'Connected to WebSocket\n';
                
                // Send additional fields
           

                // Enable the buttons once connected
                sendMessageBtn.disabled = false;
                disconnectBtn.disabled = false;
                connectBtn.disabled = true;
            };

            socket.onmessage = function (event) {
                console.log('Message received:', event.data);
                messageOutput.innerText += 'Received: ' + event.data + '\n';
            };

            socket.onclose = function () {
                console.log('WebSocket connection closed');
                messageOutput.innerText += 'Disconnected from WebSocket\n';
                
                // Disable the buttons once disconnected
                sendMessageBtn.disabled = true;
                disconnectBtn.disabled = true;
                connectBtn.disabled = false;
            };

            socket.onerror = function (error) {
                console.error('WebSocket error:', error);
                messageOutput.innerText += 'Error: ' + error + '\n';
            };
        });

        disconnectBtn.addEventListener('click', function () {
            // Close WebSocket connection and send disconnect action
            if (socket) {
                socket.send(JSON.stringify({ action: 'disconnect' })); // Notify server about disconnect
                socket.close();
            }
        });

        sendMessageBtn.addEventListener('click', function () {
            const message = messageInput.value;
            if (message && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ action: 'message', data: message }));
                messageOutput.innerText += 'Sent: ' + message + '\n';
                messageInput.value = '';  // Clear input
            } else {
                messageOutput.innerText += 'WebSocket is not connected\n';
            }
        });
